# main に push すると、テスト → 組み立て → GitHub Pages に公開
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 接続先の変数を確かめる（空でも公開は続ける）
        if: ${{ vars.GAS_URL == '' || vars.GAS_URL_TEST == '' }}
        run: echo "::warning::GAS_URL か GAS_URL_TEST が未設定です。画面は「接続先が設定されていません」になります（変数を入れたら Deploy を Run workflow でやり直す）"
      - run: npm test
      - run: npm run build
        env:
          VITE_GAS_URL: ${{ vars.GAS_URL }}
          VITE_GAS_URL_TEST: ${{ vars.GAS_URL_TEST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
