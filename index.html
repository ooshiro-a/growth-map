    <!-- 画面の色（設定の「画面の色」。この端末だけ）：描く前に決めて、白く光らないようにする -->

      try { document.documentElement.dataset.theme = localStorage.getItem('gm.theme') || 'auto'; }
      catch (e) { document.documentElement.dataset.theme = 'auto'; }
    </script>

    <link rel="manifest" href="/manifest.webmanifest?v=1" />
  </head>
